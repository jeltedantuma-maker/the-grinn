<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIN</title>
<style>
:root { --fg: #d9d3c4; --dim: #8a8478; --red: #a3201a; --bg: #050505; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--fg); font-family: Georgia, 'Times New Roman', serif; user-select: none; }
canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #000; cursor: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui .screen, #ui button, #ui input, #note, #phone, #keypad, #clickToPlay, #death { pointer-events: auto; }
.hidden { display: none !important; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; color: var(--dim); letter-spacing: .3em; font-size: 14px; z-index: 50; text-align: center; padding: 20px; }

/* ---------- HUD ---------- */
#crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(230,225,210,.35); }
#prompt { position: absolute; left: 50%; top: 56%; transform: translateX(-50%); font-size: 15px; letter-spacing: .08em; color: #e8e2d0; text-shadow: 0 0 6px #000, 0 0 2px #000; transition: opacity .15s; font-family: 'Courier New', monospace; }
#objectives { position: absolute; left: 28px; top: 24px; max-width: 360px; }
#objectives .obj { font-size: 14px; color: rgba(220,214,198,.72); margin-bottom: 6px; padding-left: 14px; position: relative; text-shadow: 0 0 4px #000; font-style: italic; }
#objectives .obj::before { content: ''; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border: 1px solid rgba(220,214,198,.6); transform: rotate(45deg); }
#objectives .obj span { color: rgba(220,214,198,.5); font-style: normal; }
#objectives .obj.extra { color: #c55; font-style: normal; font-family: 'Courier New', monospace; }
#objectives .obj.extra::before { border-color: #c55; }
#notify { position: absolute; right: 30px; top: 26px; text-align: right; font-size: 17px; opacity: 0; text-shadow: 0 0 6px #000; }
#notify small { display: block; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
#notify.show { animation: notif 4s ease forwards; }
@keyframes notif { 0% { opacity: 0; transform: translateY(-6px); } 10% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
#hint { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); font-size: 16px; color: #d8d2c0; text-shadow: 0 0 6px #000; transition: opacity .6s; opacity: 0; text-align: center; max-width: 70vw; }
#subtitle { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); font-size: 19px; color: #ece6d6; text-shadow: 0 0 8px #000, 0 0 2px #000; transition: opacity .8s; opacity: 0; font-style: italic; text-align: center; max-width: 80vw; }
#meters { position: absolute; left: 28px; bottom: 26px; display: flex; align-items: center; gap: 16px; }
.meter { width: 130px; height: 3px; background: rgba(255,255,255,.08); transition: opacity .6s; }
.meter i { display: block; height: 100%; background: rgba(220,214,198,.7); }
.meter.ex i { background: #a33; }
#battery { position: relative; width: 34px; height: 14px; border: 1px solid rgba(220,214,198,.6); padding: 2px; transition: opacity .4s; }
#battery .cap { position: absolute; right: -4px; top: 4px; width: 3px; height: 5px; background: rgba(220,214,198,.6); }
#battery .lvl { height: 100%; background: #9b9; }
#breath { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); text-align: center; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: .2em; color: rgba(220,214,198,.7); }
#breath .bar { width: 200px; height: 3px; background: rgba(255,255,255,.1); margin-top: 6px; }
#breath .bar i { display: block; height: 100%; background: #9ab; }
#breath.holding .bar i { background: #d66; }
#save { position: absolute; right: 30px; bottom: 26px; font-size: 12px; letter-spacing: .25em; color: var(--dim); text-transform: uppercase; }
#save.blink { animation: blink 2.6s ease forwards; }
@keyframes blink { 0% { opacity: 0; } 15% { opacity: 1; } 30% { opacity: .4; } 45% { opacity: 1; } 100% { opacity: 0; } }
#inventory { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(8,8,8,.88); border: 1px solid rgba(220,214,198,.2); padding: 22px 30px; min-width: 320px; }
#inventory h3 { margin: 0 0 12px; font-weight: normal; letter-spacing: .3em; text-transform: uppercase; font-size: 13px; color: var(--dim); }
#inventory ul { margin: 0; padding: 0 0 0 18px; }
#inventory li { margin: 6px 0; }
#inventory li.empty { list-style: none; color: var(--dim); margin-left: -18px; }
.small { font-size: 12px; color: var(--dim); }
#locker { position: absolute; inset: 0; background:
  linear-gradient(rgba(0,0,0,.94) 0 18%, transparent 18% 100%),
  linear-gradient(to top, rgba(0,0,0,.94) 0 22%, transparent 22% 100%),
  repeating-linear-gradient(to bottom, rgba(0,0,0,.97) 0 26px, rgba(0,0,0,.25) 26px 38px);
  box-shadow: inset 0 0 160px 60px #000; }

#tut { position: absolute; left: 50%; top: 9%; transform: translateX(-50%); background: rgba(6,6,6,.82); border: 1px solid rgba(200,40,30,.5); padding: 14px 26px 16px; text-align: center; min-width: 360px; max-width: 70vw; box-shadow: 0 0 30px #000; }
#tut .head { font-size: 11px; letter-spacing: .4em; color: #b33; margin-bottom: 8px; font-family: 'Courier New', monospace; }
#tut .txt { font-size: 18px; line-height: 1.45; }
#tut .txt b { color: #f0e2b8; border-bottom: 1px solid rgba(240,226,184,.3); }
#tut .txt small { display: block; color: var(--dim); font-size: 13px; margin-top: 6px; font-style: italic; }
#tut.pop { animation: tpop .5s ease; }
@keyframes tpop { 0% { opacity: 0; transform: translate(-50%, -8px); } 100% { opacity: 1; transform: translate(-50%, 0); } }

#tags { position: absolute; inset: 0; pointer-events: none; }
#tags .tag { position: absolute; transform: translate(-50%, -100%); font-size: 13px; letter-spacing: .08em; color: #e8e2d0; text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap; font-family: 'Courier New', monospace; }
#tags .tag.down { color: #d55; }
.mpbox { width: min(460px, 90vw); display: flex; flex-direction: column; gap: 14px; }
.mpbox input, .mpbox select { background: #0c0c0c; color: var(--fg); border: 1px solid rgba(220,214,198,.25); font: inherit; font-size: 16px; padding: 10px 12px; letter-spacing: .08em; }
.mpbox label.mpname { display: flex; flex-direction: column; gap: 6px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.mpbox button.wide { width: 100%; }
.mprow { display: flex; gap: 8px; margin-top: 10px; }
.mprow input { flex: 1; text-transform: uppercase; }
.mpcode { text-align: center; font-size: 14px; color: var(--dim); letter-spacing: .2em; text-transform: uppercase; }
.mpcode b { display: block; font-size: 38px; color: #f0e2b8; letter-spacing: .15em; margin: 6px 0; font-family: 'Courier New', monospace; user-select: text; }
.mpcode small { display: block; text-transform: none; letter-spacing: .02em; font-style: italic; }
#mp { overflow-y: auto; }
.mpbox { max-height: 92vh; overflow-y: auto; padding-right: 4px; }
.mpserver, .mpfriends { border-top: 1px solid rgba(220,214,198,.12); padding-top: 10px; }
.mpserver h4, .mpfriends h4 { margin: 4px 0 6px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: normal; }
#srvAddr { text-transform: none !important; }
#srvRooms, #frList { list-style: none; padding: 0; margin: 4px 0; }
#srvRooms li, #frList li { padding: 6px 4px; border-bottom: 1px solid rgba(220,214,198,.06); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#frList .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
button.mini, #frList button { padding: 3px 10px; font-size: 12px; margin-left: auto; }
.mppub { display: flex; gap: 8px; align-items: center; }
#mpList { list-style: none; padding: 0; margin: 0; border: 1px solid rgba(220,214,198,.12); }
#mpList li { padding: 10px 14px; border-bottom: 1px solid rgba(220,214,198,.08); display: flex; align-items: center; gap: 10px; }
#mpList .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
#mpHostCtl { display: flex; flex-direction: column; gap: 10px; }
#mpHostCtl label { display: flex; justify-content: space-between; align-items: center; }
#mpStatus { min-height: 1.2em; color: #d8d2c0; margin: 0; }
#mpStatus.bad { color: #e66; }
#keypad .display.wait { color: #cc8; }

#gadget { position: absolute; right: 30px; bottom: 50px; font-family: 'Courier New', monospace; font-size: 14px; color: #e8dcb8; text-shadow: 0 0 4px #000; letter-spacing: .05em; }
#gadget span { color: #f3c96a; }
#gadget.empty { opacity: .45; }
#sense { position: absolute; left: 50%; top: 50%; width: 46vh; height: 46vh; border-radius: 50%; opacity: 0; pointer-events: none; transition: opacity .3s;
  background: radial-gradient(circle at 50% 0%, rgba(200,10,10,.9) 0, rgba(200,10,10,.0) 9%); }
.chars { display: grid; grid-template-columns: repeat(2, minmax(220px, 300px)); gap: 12px; }
button.char { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; position: relative; }
button.char .sw { position: absolute; right: 14px; top: 16px; width: 14px; height: 14px; border-radius: 50%; }
button.char b { font-size: 20px; letter-spacing: .12em; }
button.char i { color: var(--dim); font-size: 13px; }
button.char small, button.char em { font-size: 13px; letter-spacing: .02em; line-height: 1.35; margin: 0; }
button.char em { color: #e9cf8e; font-style: normal; }
.mpchar { display: flex; flex-direction: column; gap: 6px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
@media (max-width: 700px) { .chars { grid-template-columns: 1fr; } }

.sel { display: flex; gap: 22px; max-height: 70vh; overflow: auto; padding: 4px; }
.sel .col { display: flex; flex-direction: column; gap: 10px; width: min(340px, 44vw); }
.sel h4 { margin: 0 0 4px; font-weight: normal; letter-spacing: .3em; text-transform: uppercase; font-size: 12px; color: var(--dim); }
#mpWhere { max-width: 260px; }
@media (max-width: 700px) { .sel { flex-direction: column; } .sel .col { width: 90vw; } }

/* ---------- screens ---------- */
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; overflow-y: auto; padding: 20px 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.35) 0%, rgba(0,0,0,.9) 75%); }
.screen h2 { font-weight: normal; letter-spacing: .35em; text-transform: uppercase; font-size: 18px; color: var(--fg); margin-bottom: 26px; }
.buttons { display: flex; flex-direction: column; gap: 10px; min-width: 300px; }
button { background: transparent; border: 1px solid rgba(220,214,198,.18); color: var(--fg); font: inherit; font-size: 16px; padding: 12px 22px; letter-spacing: .12em; cursor: pointer; transition: all .2s; text-align: center; }
button:hover { border-color: rgba(200,40,30,.8); color: #fff; background: rgba(120,10,8,.18); letter-spacing: .16em; }
button small { display: block; font-size: 12px; color: var(--dim); letter-spacing: .04em; margin-top: 4px; font-style: italic; }
button.back { margin-top: 24px; min-width: 160px; }
#menu .title { font-size: clamp(64px, 13vw, 170px); letter-spacing: .25em; color: #e9e2cf; text-shadow: 0 0 30px rgba(160,20,10,.45); position: relative; margin-right: -.25em; font-weight: bold; }
#menu .tag { color: var(--dim); letter-spacing: .6em; text-transform: uppercase; font-size: 13px; margin: 8px 0 50px; }
#menu .foot { position: absolute; bottom: 28px; color: #5d584f; font-size: 13px; letter-spacing: .15em; font-style: italic; }
.glitch { animation: flick 6s infinite; }
@keyframes flick { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .2; } 94% { opacity: 1; } 96% { opacity: .5; transform: translateX(3px); } 97% { opacity: 1; transform: none; } }
#settings label { display: flex; justify-content: space-between; align-items: center; gap: 20px; width: 380px; margin: 8px 0; font-size: 15px; }
#settings label.check { justify-content: flex-start; }
#settings input[type=range] { width: 180px; accent-color: #a3201a; }
.bright-test { width: 80px; height: 80px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 44px; color: #fff; margin-top: 6px; }
#controls table { border-collapse: collapse; font-size: 15px; }
#controls td { padding: 6px 16px; border-bottom: 1px solid rgba(255,255,255,.06); }
#controls td:first-child { font-family: 'Courier New', monospace; color: #e8d9b0; text-align: right; }
#controls p { max-width: 520px; text-align: center; margin-top: 18px; }
#death { background: radial-gradient(ellipse at center, rgba(40,0,0,.6), rgba(0,0,0,.96) 70%); }
#death .dtitle { font-size: 44px; letter-spacing: .12em; margin-bottom: 40px; color: #d9cfc0; font-style: italic; }

/* ---------- card ---------- */
#card { position: absolute; left: 0; right: 0; top: 36%; text-align: center; opacity: 0; }
#card.show { animation: card 5s ease forwards; }
@keyframes card { 0% { opacity: 0; letter-spacing: .1em; } 20% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; letter-spacing: .25em; } }
#card .num { letter-spacing: .5em; font-size: 13px; color: var(--dim); }
#card .title { font-size: 46px; letter-spacing: .12em; margin: 12px 0; text-shadow: 0 0 20px #000; }
#card .sub { font-style: italic; color: var(--dim); }

/* ---------- note / phone / keypad ---------- */
#note { position: absolute; inset: 0; background: rgba(0,0,0,.72); display: flex; flex-direction: column; align-items: center; justify-content: center; }
#note .paper { width: min(520px, 90vw); background: #d6cdb3; color: #2a2620; padding: 34px 40px 40px; box-shadow: 0 0 60px #000; transform: rotate(-1deg); font-size: 17px; line-height: 1.55; background-image: radial-gradient(ellipse at 20% 10%, rgba(120,90,40,.25), transparent 60%), radial-gradient(ellipse at 90% 90%, rgba(80,50,20,.3), transparent 50%); }
#note h3 { margin: 0 0 16px; font-size: 13px; letter-spacing: .25em; text-transform: uppercase; color: #6b6150; font-weight: normal; }
#note .close, #phone .close { margin-top: 18px; color: var(--dim); font-size: 12px; letter-spacing: .2em; }
#phone { position: absolute; inset: 0; background: rgba(0,0,0,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
#phone .device { width: 320px; border-radius: 26px; border: 2px solid #222; background: #0d0f12; padding: 30px 22px; box-shadow: 0 0 80px rgba(80,120,200,.12); font-family: -apple-system, 'Segoe UI', Arial, sans-serif; }
#phone .from { font-size: 13px; color: #8a96a8; margin-bottom: 10px; }
#phone .msg { background: #1e2530; color: #e6eaf0; padding: 14px 16px; border-radius: 16px 16px 16px 4px; font-size: 15px; line-height: 1.45; }
#phone .time { font-size: 11px; color: #5d6878; margin-top: 8px; }
#keypad { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
#keypad .pad { background: #1a1c1c; border: 2px solid #333; padding: 22px; width: 270px; box-shadow: 0 0 60px #000; font-family: 'Courier New', monospace; text-align: center; }
#keypad .display { background: #0b120b; color: #8f8; font-size: 34px; letter-spacing: .4em; padding: 10px 0 10px .4em; margin-bottom: 16px; border: 1px solid #222; }
#keypad .display.bad { color: #f55; } #keypad .display.ok { color: #6f6; text-shadow: 0 0 8px #6f6; }
#keypad .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
#keypad .key { background: #2a2c2c; border: 1px solid #444; color: #ddd; padding: 12px 0; font-size: 18px; cursor: pointer; }
#keypad .key:hover { background: #3a3c3c; }
#clickToPlay { position: absolute; left: 50%; top: 60%; transform: translateX(-50%); padding: 10px 20px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.6); letter-spacing: .2em; cursor: pointer; }
#error { position: absolute; left: 10px; bottom: 10px; color: #f88; font-family: monospace; font-size: 12px; background: rgba(0,0,0,.7); padding: 6px; }

/* ---------- ending ---------- */
#ending { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
#marker { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity .5s; pointer-events: none; }
#marker i { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border: 2px solid rgba(235,225,200,.85); transform: rotate(45deg); box-shadow: 0 0 10px rgba(255,240,200,.5); animation: mk 1.6s ease-in-out infinite; }
#marker span { position: absolute; left: -40px; top: 14px; width: 80px; text-align: center; font: 12px 'Courier New', monospace; color: rgba(235,225,200,.85); text-shadow: 0 0 4px #000; }
#marker.edge i { border-color: rgba(235,200,150,.6); }
@keyframes mk { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
#call { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); background: rgba(10,10,12,.82); border: 1px solid rgba(200,190,170,.25); padding: 8px 18px; border-radius: 18px; font: 13px 'Courier New', monospace; color: #e6dfcd; letter-spacing: .08em; display: flex; gap: 14px; align-items: center; }
#call b { color: #f0e6d0; } #call span { color: #9c9; }
#letterbox div { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height .8s ease; }
#letterbox div:first-child { top: 0; } #letterbox div:last-child { bottom: 0; }
#letterbox.on div { height: 11vh; }
#ending .lines { text-align: center; }
#ending p { opacity: 0; transition: opacity 1.4s; font-size: 22px; margin: 18px 0; letter-spacing: .06em; }
#ending p.on { opacity: 1; }
#ending p.quiet { color: var(--dim); font-style: italic; }
#ending p.big { font-size: 90px; letter-spacing: .3em; font-weight: bold; }
#ending p.small { font-size: 14px; color: var(--dim); }
#ending p.big2 { font-size: 40px; letter-spacing: .15em; }
#scare { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; animation: shake .08s infinite; z-index: 5; }
#scare canvas { height: 115vh; filter: contrast(1.4) brightness(1.1); }
#scare.quick { background: rgba(60,0,0,.55); animation: shake .05s infinite; }
#scare.quick canvas { height: 150vh; filter: contrast(1.8) brightness(1.3) sepia(.4) hue-rotate(-30deg); }
#settings select { background: #111; color: var(--fg); border: 1px solid rgba(220,214,198,.25); font: inherit; padding: 4px 8px; }
@keyframes shake { 0% { transform: translate(6px, -4px) scale(1.04); } 50% { transform: translate(-8px, 5px) scale(1.07); } 100% { transform: translate(4px, 6px) scale(1.05); } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui"></div>
<div id="loading">LOADING...</div>
<script>
(() => {
  // src/math.js
  var clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
  var rand = (a = 0, b = 1) => a + Math.random() * (b - a);
  var pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  var angDiff = (a, b) => {
    let d = (b - a) % (Math.PI * 2);
    return d > Math.PI && (d -= Math.PI * 2), d < -Math.PI && (d += Math.PI * 2), d;
  }, approach = (cur, target, maxStep) => cur < target ? Math.min(cur + maxStep, target) : Math.max(cur - maxStep, target);
  function seeded(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0, a = a + 1831565813 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      return t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t, ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var mat4 = {
    create() {
      let m = new Float32Array(16);
      return m[0] = m[5] = m[10] = m[15] = 1, m;
    },
    identity(m) {
      return m.fill(0), m[0] = m[5] = m[10] = m[15] = 1, m;
    },
    copy(o, a) {
      return o.set(a), o;
    },
    multiply(o, a, b) {
      let a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3], a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7], a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11], a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
      for (let i = 0; i < 4; i++) {
        let b0 = b[i * 4], b1 = b[i * 4 + 1], b2 = b[i * 4 + 2], b3 = b[i * 4 + 3];
        o[i * 4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30, o[i * 4 + 1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31, o[i * 4 + 2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32, o[i * 4 + 3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
      }
      return o;
    },
    perspective(o, fovy, aspect, near, far) {
      let f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
      return o.fill(0), o[0] = f / aspect, o[5] = f, o[10] = (far + near) * nf, o[11] = -1, o[14] = 2 * far * near * nf, o;
    },

        return b.cylinder(0, 0.75, 0, 0.2, 0.22, 1.5, 10), b.sphere(0, 1.62, 0, 0.12, 0.14, 0.12, 10, 8), r.mesh(b);
      })());
      r.draw(g, this.assets.m("black", { color: [0.18, 0.18, 0.2] }), mat4.fromTRS(mat4.create(), p.x, 0, p.z, 0, p.yaw, 0));
    }
    drawClownAt(x, z, yaw, mat = null) {
      let c = this.clown, save = { x: c.x, z: c.z, yaw: c.yaw, present: c.present, curSpeed: c.curSpeed };
      c.x = x, c.z = z, c.yaw = yaw, c.present = !0, c.curSpeed = 0, c.draw(this.renderer, mat), Object.assign(c, save);
    }
  };
  function normalize3(v) {
    let l = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  }

  // src/main.js
  function boot() {
    let canvas2 = document.getElementById("view");
    try {
      let game = new Game(canvas2);
      window.__game = game, document.getElementById("loading").classList.add("hidden");
    } catch (e) {
      console.error(e);
      let l = document.getElementById("loading");
      l.textContent = "Could not start the game: " + e.message + " \u2014 try Chrome or Edge with hardware acceleration enabled.";
    }
  }
  requestAnimationFrame(() => setTimeout(boot, 30));
})();
